name: Feature request
description: Propose a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why (operator, admin, supplier, customer…).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen. Mention costs if it needs a paid service or real LLM calls.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes the n8n contract (internal routes or `message.ready`)
        - label: Needs a database migration
        - label: Is a stack deviation (needs an ADR)
