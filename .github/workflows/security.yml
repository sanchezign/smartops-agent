# Weekly security run (phase 11 M3): the whole git history through gitleaks and the
# production dependency audit gate, even when nobody pushes. Also runnable by hand.
name: Security

on:
  schedule:
    # Mondays 03:00 America/Montevideo (UTC-3) = 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Full-history secret scan (gitleaks 8.30.1, pinned by digest)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit gate (no install needed, pnpm audit reads the lockfile)
        run: node apps/api/scripts/security/audit-gate.ts
