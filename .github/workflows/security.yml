# Scheduled security runs (phase 11 M3; nightly scan ADR-028). Also runnable by hand (workflow_dispatch
# runs both jobs).
# - security (weekly): the whole git history through gitleaks.
# - nightly-scan (daily): what the pull-request gates deliberately do NOT do (they only block what a
#   change introduces). Scans main's lockfile with the STRICT audit gate (every HIGH/CRITICAL without a
#   valid exception counts) and the PUBLISHED images of the latest release with Trivy (OS packages AND
#   libraries). A finding turns the run red and GitHub e-mails the failed scheduled run: that is the
#   notification. Fail closed: a scan that cannot run, or a report that proves nothing was scanned, is red.
# GitHub disables scheduled workflows after 60 days without repository activity once the repository is
# public (docs/ci-cd.md, "Is the nightly scan still running?").
name: Security

on:
  schedule:
    # Mondays 03:00 America/Montevideo (UTC-3) = 06:00 UTC.
    - cron: "0 6 * * 1"
    # Every day 03:30 America/Montevideo = 06:30 UTC.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: security
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Full-history secret scan (gitleaks 8.30.1, pinned by digest)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit gate (no install needed, pnpm audit reads the lockfile)
        run: node apps/api/scripts/security/audit-gate.ts

  nightly-scan:
    name: nightly-scan
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Read the published (private) images of this repository with the job's own token.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # STRICT (no base commit to compare with): the audit of main as it is today, exceptions and their expiry included.
      - name: Dependency audit gate, strict (pnpm audit --prod of main's lockfile)
        run: node apps/api/scripts/security/audit-gate.ts

      - name: Latest release (the images that are published)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          case "$tag" in v[0-9]*) ;; *) echo "::error::unexpected release tag: $tag"; exit 1 ;; esac
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Trivy pulls the images itself with the job's token (no docker login, no secret in a command
      # line). --exit-code 0: Trivy's own status then only means "the scan could not run" (pull denied,
      # database download failed) and `set -e` makes that red; findings are judged by trivy-gate.ts,
      # which also refuses a report that proves nothing was scanned. .trivyignore (accepted CVEs / GHSAs
      # with expiry, mirrored in security/audit-exceptions.json) is read by Trivy.
      - name: Scan the published images (Trivy 0.74.0, OS packages + libraries, HIGH/CRITICAL, fixable)
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p "$RUNNER_TEMP/trivy"
          chmod 777 "$RUNNER_TEMP/trivy"
          for app in api admin; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v "$PWD/.trivyignore:/.trivyignore:ro" -v "$RUNNER_TEMP/trivy:/out" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /.trivyignore --exit-code 0 --format json --output "/out/$app.json" \
              "ghcr.io/${owner}/smartops-${app}:${VERSION}"
          done

      - name: Trivy gate (any finding left, or a report that proves nothing, fails)
        run: node apps/api/scripts/security/trivy-gate.ts "$RUNNER_TEMP/trivy/api.json" "$RUNNER_TEMP/trivy/admin.json"
