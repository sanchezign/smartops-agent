# Release (phase 11 M5): release-please keeps a release PR up to date on every push to main;
# merging that PR creates the tag vX.Y.Z + GitHub release, and THIS SAME RUN builds the images
# (a tag created with GITHUB_TOKEN never triggers another workflow).
# Images: API and panel, native amd64 + arm64 builds (no QEMU), every image checked BEFORE it is
# pushed (no .env / keys / secrets, container smoke test, Trivy), pushed by digest to GHCR
# (private while the repository is private), then merged into one multi-arch tag.
# Nothing is deployed here (phase 12).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # As documented by release-please-action (issues: the autorelease labels on its PRs).
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build ${{ matrix.app }} (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, admin]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Image name (GHCR needs lowercase)
        id: name
        env:
          APP: ${{ matrix.app }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smartops-${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # The image's version label (org.opencontainers.image.version) comes from the tag given
          # here. Without it the label was the git ref ("main") and deploy/bin/fetch-bundle.sh
          # refused the first published images (phase 12 M4).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
          flavor: latest=false
      # 1. Build once into the local Docker engine and check that exact build.
      - name: Build (local, for the checks)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: smartops-${{ matrix.app }}:release
          provenance: false
          sbom: false
      - name: No .env, keys or secrets inside the image
        env:
          APP: ${{ matrix.app }}
        run: |
          dirs=(/app)
          [ "$APP" = api ] && dirs+=(/opt/smartops-deploy) # the deploy bundle (phase 12)
          scripts/ci/image-secrets-check.sh "smartops-${APP}:release" "${dirs[@]}"
      - name: Container smoke test (fake values only; the declared version must be the release's)
        env:
          APP: ${{ matrix.app }}
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/ci/"${APP}"-container-smoke.sh "smartops-${APP}:release"
      - name: OS-package vulnerabilities (Trivy 0.74.0; fixable HIGH/CRITICAL block)
        env:
          APP: ${{ matrix.app }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --quiet --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "smartops-${APP}:release"
      # 2. Push by digest: same builder, every layer comes from the build above (cache hit),
      #    plus SBOM and provenance attestations.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.app }}
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, admin]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
      - name: Image name (GHCR needs lowercase)
        id: name
        env:
          APP: ${{ matrix.app }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smartops-${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # vX.Y.Z → 0.11.0 and 0.11, plus sha-xxxxxxx. No "latest": deploys pin a version.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=sha,prefix=sha-
          flavor: latest=false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch tags (amd64 + arm64)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          count="$(find . -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64 + arm64), found $count"; exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
      - name: Inspect
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          # The published image (every platform) declares the version it is tagged with.
          scripts/ci/image-version-check.sh published "$IMAGE:$VERSION" "$VERSION"
