# CI (phase 11). Suites, triggers and minutes budget: docs/ci-cd.md.
# - quick: every push to any branch (its check is attached to the commit, so it also shows on
#   the pull request without running twice). Pull requests from forks run it too.
# - plan → integration-coverage + e2e: pull requests to main, the nightly run and manual runs,
#   following the E2E_POLICY repository variable (apps/api/scripts/ci/e2e-policy.ts).
# - main-guard: soft enforcement while branch protection is unavailable (private repo on
#   GitHub Free): a push to main must come from a merged pull request.
# Every action is pinned to a full commit SHA (version in the comment); Renovate updates them.
# No real key is ever used: the tests and the E2E run with fake values (DEMO_MODE forces fakes).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 America/Montevideo (UTC-3, no DST) = 06:00 UTC. Runs only if main changed in 24 h.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (full history — the ratchet and CLAUDE.md guards compare with origin/main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint the workflows (actionlint 1.7.12, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Audit the workflows (zizmor 1.30.1, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --offline --min-severity=low .github/workflows

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (from .nvmrc) with the pnpm store cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Scan the new commits for secrets (gitleaks 8.30.1, pinned by digest)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # New branch, force push or pull request: everything not yet on main.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="origin/main..HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          echo "gitleaks range: $range"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro"             ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f             git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="$range"

      - run: pnpm install --frozen-lockfile
      - name: Dependency audit gate (high/critical in production, security/audit-exceptions.json)
        run: node apps/api/scripts/security/audit-gate.ts
      - name: Documentation links (relative files and anchors, offline)
        run: node apps/api/scripts/ci/doc-links.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # API unit + HTTP e2e (stubbed deps) and panel logic. Includes the n8n contract freshness,
      # the CLAUDE.md guard (vs origin/main) and the coverage-ratchet guard.
      - run: pnpm test:fast
      - name: Deploy bundle (shellcheck, Caddyfile, compose invariants — tools pinned by digest)
        run: scripts/ci/check-deploy-bundle.sh

  plan:
    name: plan
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docker: ${{ steps.changes.outputs.docker }}
      e2e: ${{ steps.policy.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Docs-only change? (skipped jobs report success, so required checks never hang)
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # release-please's PR only bumps versions and the CHANGELOG; since June 2026 GitHub also
          # makes such bot PRs wait for an approval (docs/ci-cd.md). Once approved, nothing to test.
          if [[ "$GITHUB_EVENT_NAME" = "pull_request" && "$HEAD_REF" == release-please--* ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "release-please PR (versions + CHANGELOG only): the slow suite is skipped."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            # Images are validated on manual runs and on pull requests that touch them.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then docker=true; else docker=false; fi
            echo "docker=$docker" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if echo "$changed" | grep -qE '(^|/)Dockerfile$|^\.dockerignore$|(^|/)package\.json$|^pnpm-lock\.yaml$|^apps/admin/next\.config\.ts$|^apps/api/prisma/|^scripts/ci/|^deploy/|^n8n/workflows/'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed: the slow suite is skipped."
          fi

      - name: E2E policy (repository variable E2E_POLICY = private | public)
        id: policy
        env:
          E2E_POLICY: ${{ vars.E2E_POLICY }}
        run: |
          NEW_COMMITS=$(git log --since="24 hours ago" --oneline origin/main | wc -l)
          export NEW_COMMITS
          node apps/api/scripts/ci/e2e-policy.ts

  integration-coverage:
    name: integration-coverage
    needs: plan
    if: >-
      needs.plan.outputs.code == 'true' &&
      (github.event_name != 'schedule' || needs.plan.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        # Throw-away database for this job only (fake credentials, never a real one).
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      # The name must end in _test (the integration global setup refuses anything else).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartops_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit + integration (real Postgres, pg-boss, migrations from scratch, startup smoke) +
      # panel, with the coverage-ratchet thresholds as the gate.
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: e2e
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      # The E2E derives its own <db>_e2e_demo database from this (apps/admin/e2e/env.ts).
      E2E_BASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartops/api db:generate
      # No browser cache on purpose (Playwright docs: restoring takes about as long as the
      # download, and the OS dependencies are not cacheable) — user decision, phase 11.
      - run: pnpm --filter @smartops/admin exec playwright install --with-deps chromium webkit
      # CI=true: one retry, and a test that only passes on the retry is reported as flaky.
      # Playwright is called directly, not through pnpm: pnpm 12 runs children in a new process
      # group, out of reach of the runner when a step times out. Build + 112 tests ≈ 5 min;
      # the step timeout caps any hang (phase 11: a web server that never stopped burned 30 min).
      - name: Browser E2E
        working-directory: apps/admin
        timeout-minutes: 12
        run: ./node_modules/.bin/playwright test
      - name: Upload the report and traces (failures only, 7 days — artifacts share 500 MB)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/admin/e2e/report
            apps/admin/e2e/results
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: images
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # amd64 only and never pushed: releases build both architectures natively (release.yml).
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t smartops-api:ci .
      - name: Build the panel image
        run: docker build -f apps/admin/Dockerfile -t smartops-admin:ci .
      - name: No .env, keys or secrets inside the images
        run: |
          scripts/ci/image-secrets-check.sh smartops-api:ci /app /opt/smartops-deploy
          scripts/ci/image-secrets-check.sh smartops-admin:ci /app
      - name: API container smoke test (migrations, health, SIGTERM — fake values only)
        run: scripts/ci/api-container-smoke.sh smartops-api:ci
      - name: Panel container smoke test (login page, SIGTERM)
        run: scripts/ci/admin-container-smoke.sh smartops-admin:ci
      - name: OS-package vulnerabilities (Trivy 0.74.0; fixable HIGH/CRITICAL block, npm deps are the audit gate)
        # Both images are always scanned and both results are shown; the step fails at the end if any failed.
        # .trivyignore (the accepted CVEs, with expiry; mirrored in security/audit-exceptions.json) is
        # mounted into the Trivy container; --show-suppressed prints what it ignored, as proof it was read.
        run: |
          failed=0
          for img in smartops-api:ci smartops-admin:ci; do
            echo "::group::Trivy $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --quiet --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
              --ignore-unfixed --ignorefile /.trivyignore --show-suppressed --exit-code 1 "$img" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  main-guard:
    name: main-guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: The pushed commit must belong to a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          prs=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/pulls" | jq '[.[] | select(.merged_at != null)] | length')
          if [ "$prs" -eq 0 ]; then
            echo "::error::Direct push to main ($SHA): main only changes through a merged pull request."
            exit 1
          fi
          echo "OK: $SHA comes from $prs merged pull request(s)."
