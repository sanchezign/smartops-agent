packages:
  - apps/*

# pnpm >= 11: dependency build scripts must be explicitly allowed (true) or
# explicitly skipped (false); unreviewed ones fail the install.
allowBuilds:
  # tsx / vitest bundler binary
  esbuild: true
  # eslint-config-next resolver: prebuilt native binding ships as an optional
  # dependency, the postinstall fallback is not needed.
  unrs-resolver: false
  # Prisma CLI: preinstall only checks the Node version; @prisma/engines
  # postinstall downloads the schema engine binary used by `prisma migrate`.
  prisma: true
  "@prisma/engines": true
  # next-intl 4 (phase 13) message-extraction tooling: prebuilt native bindings ship as
  # optional dependencies; the postinstall fallbacks (build from source / wasm) are not needed.
  "@parcel/watcher": false
  "@swc/core": false
